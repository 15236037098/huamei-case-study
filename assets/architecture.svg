<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4B3A4"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- layer labels -->
  <g fill="#9B8B7B" font-size="11" letter-spacing="1.5">
    <text x="40" y="86">触达层</text>
    <text x="40" y="216">接入层</text>
    <text x="40" y="376">智能层</text>
    <text x="40" y="526">知识层</text>
    <text x="40" y="676">数据层</text>
  </g>

  <!-- ===== band 1 ===== -->
  <g>
    <rect x="120" y="40" width="320" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="142" y="72" font-size="15" font-weight="600" fill="#3B2F2F">Web 获客顾问</text>
    <text x="142" y="96" font-size="12" fill="#7A6A5C">React 19 + Vite · 流式对话</text>
    <text x="142" y="114" font-size="12" fill="#7A6A5C">移动端同源 · 首屏与对话态切换</text>

    <rect x="460" y="40" width="320" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="482" y="72" font-size="15" font-weight="600" fill="#3B2F2F">管理后台</text>
    <text x="482" y="96" font-size="12" fill="#7A6A5C">工作台 · 会话接待 · 知识治理</text>
    <text x="482" y="114" font-size="12" fill="#7A6A5C">五岗位菜单 / 接口 / 数据三层权限</text>

    <rect x="800" y="40" width="320" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="822" y="72" font-size="15" font-weight="600" fill="#3B2F2F">渠道适配</text>
    <text x="822" y="96" font-size="12" fill="#7A6A5C">Web · 企业微信 / 抖音 / 小红书</text>
    <text x="822" y="114" font-size="12" fill="#7A6A5C">未完成验签的渠道只登记不发送</text>
  </g>

  <!-- ===== band 2 ===== -->
  <g>
    <rect x="120" y="170" width="245" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="142" y="202" font-size="15" font-weight="600" fill="#3B2F2F">Node 网关</text>
    <text x="142" y="226" font-size="12" fill="#7A6A5C">server.mjs · 路由拆分</text>
    <text x="142" y="244" font-size="12" fill="#7A6A5C">CORS 白名单 / 租户上下文</text>

    <rect x="385" y="170" width="245" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="407" y="202" font-size="15" font-weight="600" fill="#3B2F2F">会话与鉴权</text>
    <text x="407" y="226" font-size="12" fill="#7A6A5C">OIDC 校验 · 管理会话</text>
    <text x="407" y="244" font-size="12" fill="#7A6A5C">联系方式一次性查看</text>

    <rect x="650" y="170" width="245" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="672" y="202" font-size="15" font-weight="600" fill="#3B2F2F">分段流式通道</text>
    <text x="672" y="226" font-size="12" fill="#7A6A5C">SSE · reply_segments 逐段下发</text>
    <text x="672" y="244" font-size="12" fill="#7A6A5C">最终事件与归档回执同源</text>

    <rect x="915" y="170" width="205" height="92" rx="12" fill="#FBF8F1" stroke="#E6DBCB"/>
    <text x="937" y="202" font-size="15" font-weight="600" fill="#3B2F2F">并发与超时</text>
    <text x="937" y="226" font-size="12" fill="#7A6A5C">解析闸门 2 并发</text>
    <text x="937" y="244" font-size="12" fill="#7A6A5C">读满响应体的超时</text>
  </g>

  <!-- ===== band 3 ===== -->
  <g>
    <rect x="120" y="320" width="245" height="112" rx="12" fill="#FDF3F0" stroke="#E9C9C3"/>
    <text x="142" y="352" font-size="15" font-weight="600" fill="#8E3F53">意图识别</text>
    <text x="142" y="376" font-size="12" fill="#7A6A5C">规则评分 + 模型提议</text>
    <text x="142" y="394" font-size="12" fill="#7A6A5C">白名单与原文证据校验</text>
    <text x="142" y="412" font-size="12" fill="#7A6A5C">安全意图先于业务意图</text>

    <rect x="385" y="320" width="245" height="112" rx="12" fill="#FDF3F0" stroke="#E9C9C3"/>
    <text x="407" y="352" font-size="15" font-weight="600" fill="#8E3F53">LangGraph 编排</text>
    <text x="407" y="376" font-size="12" fill="#7A6A5C">Python 独立服务</text>
    <text x="407" y="394" font-size="12" fill="#7A6A5C">多子任务 · 槽位与澄清</text>
    <text x="407" y="412" font-size="12" fill="#7A6A5C">契约测试守住协议</text>

    <rect x="650" y="320" width="245" height="112" rx="12" fill="#FDF3F0" stroke="#E9C9C3"/>
    <text x="672" y="352" font-size="15" font-weight="600" fill="#8E3F53">回答策略</text>
    <text x="672" y="376" font-size="12" fill="#7A6A5C">本地草稿优先，模型润色</text>
    <text x="672" y="394" font-size="12" fill="#7A6A5C">引用与拒答同一条链路</text>
    <text x="672" y="412" font-size="12" fill="#7A6A5C">输出后再次合规检查</text>

    <rect x="915" y="320" width="205" height="112" rx="12" fill="#FDF3F0" stroke="#E9C9C3"/>
    <text x="937" y="352" font-size="15" font-weight="600" fill="#8E3F53">风险门禁</text>
    <text x="937" y="376" font-size="12" fill="#7A6A5C">医疗异常不检索</text>
    <text x="937" y="394" font-size="12" fill="#7A6A5C">转人工 · 阻断</text>
    <text x="937" y="412" font-size="12" fill="#7A6A5C">联系信息只走确定规则</text>
  </g>

  <!-- ===== band 4 ===== -->
  <g>
    <rect x="120" y="470" width="245" height="92" rx="12" fill="#F6F9F7" stroke="#CFE0D9"/>
    <text x="142" y="502" font-size="15" font-weight="600" fill="#2F6F63">知识发布</text>
    <text x="142" y="526" font-size="12" fill="#7A6A5C">草稿 → 院方确认 → 发布</text>
    <text x="142" y="544" font-size="12" fill="#7A6A5C">版本绑定与回滚</text>

    <rect x="385" y="470" width="245" height="92" rx="12" fill="#F6F9F7" stroke="#CFE0D9"/>
    <text x="407" y="502" font-size="15" font-weight="600" fill="#2F6F63">运行时索引</text>
    <text x="407" y="526" font-size="12" fill="#7A6A5C">只读发布快照</text>
    <text x="407" y="544" font-size="12" fill="#7A6A5C">5 秒准入缓存</text>

    <rect x="650" y="470" width="245" height="92" rx="12" fill="#F6F9F7" stroke="#CFE0D9"/>
    <text x="672" y="502" font-size="15" font-weight="600" fill="#2F6F63">GraphRAG / 本地检索</text>
    <text x="672" y="526" font-size="12" fill="#7A6A5C">图谱召回与向量召回</text>
    <text x="672" y="544" font-size="12" fill="#7A6A5C">不可用时降级并可解释</text>

    <rect x="915" y="470" width="205" height="92" rx="12" fill="#F6F9F7" stroke="#CFE0D9"/>
    <text x="937" y="502" font-size="15" font-weight="600" fill="#2F6F63">出站策略</text>
    <text x="937" y="526" font-size="12" fill="#7A6A5C">地址校验后发密钥</text>
    <text x="937" y="544" font-size="12" fill="#7A6A5C">非法地址直接降级</text>
  </g>

  <!-- ===== band 5 ===== -->
  <g>
    <rect x="120" y="620" width="245" height="92" rx="12" fill="#FAF7F2" stroke="#E6DBCB"/>
    <text x="142" y="652" font-size="15" font-weight="600" fill="#3B2F2F">SQLite / PostgreSQL</text>
    <text x="142" y="676" font-size="12" fill="#7A6A5C">WAL 本地库 · RLS 多租户</text>
    <text x="142" y="694" font-size="12" fill="#7A6A5C">仓储接口统一读写</text>

    <rect x="385" y="620" width="245" height="92" rx="12" fill="#FAF7F2" stroke="#E6DBCB"/>
    <text x="407" y="652" font-size="15" font-weight="600" fill="#3B2F2F">Redis</text>
    <text x="407" y="676" font-size="12" fill="#7A6A5C">检索与限流缓存</text>
    <text x="407" y="694" font-size="12" fill="#7A6A5C">Redis 不可用时回退本地</text>

    <rect x="650" y="620" width="245" height="92" rx="12" fill="#FAF7F2" stroke="#E6DBCB"/>
    <text x="672" y="652" font-size="15" font-weight="600" fill="#3B2F2F">对象存储</text>
    <text x="672" y="676" font-size="12" fill="#7A6A5C">OSS 资料与分身媒体</text>
    <text x="672" y="694" font-size="12" fill="#7A6A5C">流式下载 · 超限中止</text>

    <rect x="915" y="620" width="205" height="92" rx="12" fill="#FAF7F2" stroke="#E6DBCB"/>
    <text x="937" y="652" font-size="15" font-weight="600" fill="#3B2F2F">观测与审计</text>
    <text x="937" y="676" font-size="12" fill="#7A6A5C">结构化日志 · 脱敏</text>
    <text x="937" y="694" font-size="12" fill="#7A6A5C">接管与发布写审计</text>
  </g>

  <!-- connectors -->
  <g stroke="#C4B3A4" stroke-width="1.4" fill="none">
    <path d="M580 134 L580 168" marker-end="url(#arrow)"/>
    <path d="M580 264 L580 318" marker-end="url(#arrow)"/>
    <path d="M580 434 L580 468" marker-end="url(#arrow)"/>
    <path d="M580 564 L580 618" marker-end="url(#arrow)"/>
  </g>

  <text x="600" y="760" text-anchor="middle" font-size="11" fill="#A8988A" letter-spacing="0.6">图示为对外可公开的抽象分层，省略了内部模块与配置细节</text>
</svg>
